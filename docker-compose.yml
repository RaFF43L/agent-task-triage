services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 4dev-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      # Host 5433 -> container 5432 (evita conflito com outro postgres em 5432).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Habilita a extensao vector automaticamente na 1a inicializacao do banco.
      - ./script/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
