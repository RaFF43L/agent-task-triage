[project]
name = "4dev-lang-graph"
version = "0.1.0"
description = "Agente de triagem com LangGraph + Amazon Bedrock"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.19",
    "botocore>=1.40.59",
    "langchain-aws>=1.1.1",
    "langchain>=1.0.2",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.0.0",
    # Providers alternativos (fora do Bedrock)
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # RAG: vector store em Postgres + pgvector
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # RAG: parsing de PDF
    "pypdf>=5.0.0",
    # Migrations de banco (schema versionado)
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]
